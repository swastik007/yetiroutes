# Laragon Virtual Host Configuration for Yeti Routes
# Save this to: C:\laragon\etc\apache2\sites-enabled\yetiroutes.test.conf

<VirtualHost *:80>
    ServerName yetiroutes.test
    ServerAlias *.yetiroutes.test

    # IMPORTANT: Point to the public/ directory!
    DocumentRoot "D:/server/yetiroutes/public"

    <Directory "D:/server/yetiroutes/public">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted

        # Enable mod_rewrite
        RewriteEngine On
    </Directory>

    ErrorLog "C:/laragon/etc/apache2/logs/yetiroutes-error.log"
    CustomLog "C:/laragon/etc/apache2/logs/yetiroutes-access.log" combined
</VirtualHost>

# How to apply:
# 1. Right-click Laragon tray icon
# 2. Apache → sites-enabled → yetiroutes.test.conf
# 3. Paste the content above
# 4. Make sure DocumentRoot points to: D:/server/yetiroutes/public
# 5. Restart Apache in Laragon
